worker_processes auto;
events { worker_connections 1024; }

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
  sendfile      on;
  keepalive_timeout  65;
  # Route agent traffic through agent.<domain> and keep UI/API traffic on the human host.
  map $host $is_agent_host {
    default 0;
    ~^agent\..+ 1;
  }

  server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
  }

  server {
    listen 443 ssl;
    server_name _;

    ssl_certificate     /certs/server.crt;
    ssl_certificate_key /certs/server.key;
    ssl_client_certificate /certs/ca.crt;
    ssl_verify_client optional;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 10g;

    location /api/v1/events {
      if ($is_agent_host = 1) {
        return 404;
      }
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Client-Cert $ssl_client_escaped_cert;
      proxy_read_timeout 3600s;
      proxy_pass http://${CONTROL_PLANE_UPSTREAM};
    }

    # Bootstrap enrollment remains token-based, but is only exposed on the agent host.
    location = /api/v1/devices/enroll {
      if ($is_agent_host = 0) {
        return 421;
      }
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Client-Cert $ssl_client_escaped_cert;
      proxy_pass http://${CONTROL_PLANE_UPSTREAM};
    }

    # First-contact approval bootstrap is also agent-host only and does not require client certs.
    location ~ ^/api/v1/pending-enrollments/(request|claim)$ {
      if ($is_agent_host = 0) {
        return 421;
      }
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Client-Cert $ssl_client_escaped_cert;
      proxy_pass http://${CONTROL_PLANE_UPSTREAM};
    }

    # Device runtime endpoints: only on agent host, and require client cert.
    location = /api/v1/devices/checkin {
      if ($is_agent_host = 0) {
        return 421;
      }
      if ($ssl_client_verify != SUCCESS) {
        return 401;
      }
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Client-Cert $ssl_client_escaped_cert;
      proxy_pass http://${CONTROL_PLANE_UPSTREAM};
    }

    location = /api/v1/devices/reenroll {
      if ($is_agent_host = 0) {
        return 421;
      }
      if ($ssl_client_verify != SUCCESS) {
        return 401;
      }
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Client-Cert $ssl_client_escaped_cert;
      proxy_pass http://${CONTROL_PLANE_UPSTREAM};
    }

    location ~ ^/api/v1/devices/[^/]+/apply-result$ {
      if ($is_agent_host = 0) {
        return 421;
      }
      if ($ssl_client_verify != SUCCESS) {
        return 401;
      }
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Client-Cert $ssl_client_escaped_cert;
      proxy_pass http://${CONTROL_PLANE_UPSTREAM};
    }

    location ~ ^/api/v1/artifacts/[^/]+$ {
      if ($is_agent_host = 0) {
        return 421;
      }
      if ($ssl_client_verify != SUCCESS) {
        return 401;
      }
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Client-Cert $ssl_client_escaped_cert;
      proxy_pass http://${CONTROL_PLANE_UPSTREAM};
    }

    location ~ ^/api/v1/artifacts/[^/]+/presign$ {
      if ($is_agent_host = 0) {
        return 421;
      }
      if ($ssl_client_verify != SUCCESS) {
        return 401;
      }
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Client-Cert $ssl_client_escaped_cert;
      proxy_pass http://${CONTROL_PLANE_UPSTREAM};
    }

    location /api/ {
      if ($is_agent_host = 1) {
        return 404;
      }
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Client-Cert $ssl_client_escaped_cert;
      proxy_pass http://${CONTROL_PLANE_UPSTREAM};
    }

    location /healthz {
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Client-Cert $ssl_client_escaped_cert;
      proxy_pass http://${CONTROL_PLANE_UPSTREAM};
    }

    location / {
      if ($is_agent_host = 1) {
        return 404;
      }
      root /usr/share/nginx/html;
      try_files $uri /index.html;
    }
  }
}
