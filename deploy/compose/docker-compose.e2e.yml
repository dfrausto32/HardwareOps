# E2E test infrastructure — Postgres + MinIO only.
# The control-plane and global-plane binaries run directly (not in Docker)
# so the suite can start fast without building images.
#
# Ports are intentionally offset from dev (5432/9000) so both can
# run simultaneously on a developer machine.
#
# Start:   docker compose -f deploy/compose/docker-compose.e2e.yml up -d
# Stop:    docker compose -f deploy/compose/docker-compose.e2e.yml down -v

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: parcel
      POSTGRES_PASSWORD: parcel
      POSTGRES_DB: parcel_e2e
    volumes:
      - ./e2e-postgres-init.sql:/docker-entrypoint-initdb.d/01-global-db.sql:ro
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U parcel -d parcel_e2e"]
      interval: 2s
      timeout: 5s
      retries: 20

  minio:
    # MinIO no longer publishes prebuilt images: minio/minio on Docker Hub and
    # quay.io/minio/minio both fail to pull in CI. Chainguard's maintained build
    # (latest only) is used for the test stack. The image is distroless, so there
    # is no in-container healthcheck; the workflow waits on
    # http://localhost:9010/minio/health/live from the host instead.
    image: cgr.dev/chainguard/minio:latest
    command: server /data --console-address ":9011"
    environment:
      MINIO_ROOT_USER: miniotest
      MINIO_ROOT_PASSWORD: miniotest
    ports:
      - "9010:9000"
      - "9011:9011"
