version: "3.8"

services:
  agent:
    build:
      context: ../..
      dockerfile: agent/Dockerfile
    network_mode: "host"
    environment:
      CONTROL_PLANE_URL: ${CONTROL_PLANE_URL:-http://host.docker.internal:8080}
      STATE_PATH: /data/agent-state.json
      ARTIFACT_ROOT: /data/artifacts
      CHECKIN_INTERVAL: ${CHECKIN_INTERVAL:-}
      CHECKIN_INTERVAL_SEC: ${CHECKIN_INTERVAL_SEC:-}
      LOG_EXPORT_ADDR: ${LOG_EXPORT_ADDR:-}
      LOG_LEVEL: ${LOG_LEVEL:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - /data
