<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>HardwareOps Demo Service v2</title>
    <style>
      body { font-family: Arial, sans-serif; margin: 40px; background: #fff6f0; color: #2b1b1b; }
      .card { padding: 24px; border: 2px solid #cc5c3a; background: #ffffff; max-width: 480px; }
      h1 { margin: 0 0 12px; font-size: 28px; }
      p { margin: 0; }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>HardwareOps Demo Service - v2</h1>
      <p>The artifact update changed this content.</p>
      <p id="preapply" style="margin-top: 12px; color: #6b4a44;">Pre-apply: loading...</p>
    </div>
    <script>
      fetch('preapply.txt')
        .then(r => r.text())
        .then(t => { document.getElementById('preapply').textContent = `Pre-apply: ${t.trim() || 'ok'}`; })
        .catch(() => { document.getElementById('preapply').textContent = 'Pre-apply: unavailable'; });
    </script>
  </body>
</html>
