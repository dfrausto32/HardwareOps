<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Parcel Demo Service v1</title>
    <style>
      body { font-family: Arial, sans-serif; margin: 40px; background: #f5f7ff; color: #1a1f36; }
      .card { padding: 24px; border: 2px solid #3a5bcc; background: #ffffff; max-width: 480px; }
      h1 { margin: 0 0 12px; font-size: 28px; }
      p { margin: 0; }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>Parcel Demo Service - v1</h1>
      <p>This page is served from the active artifact.</p>
      <p id="preapply" style="margin-top: 12px; color: #4a4f6a;">Pre-apply: loading...</p>
    </div>
    <script>
      fetch('preapply.txt')
        .then(r => r.text())
        .then(t => { document.getElementById('preapply').textContent = `Pre-apply: ${t.trim() || 'ok'}`; })
        .catch(() => { document.getElementById('preapply').textContent = 'Pre-apply: unavailable'; });
    </script>
  </body>
</html>
